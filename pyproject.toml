[project]
name = "codemodernizer"
version = "0.1.0"
description = "A Streamlit app pondering chicken dreams"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "openai",
    "python-dotenv",
    "ipython>=9.10.0",
    "langchain-openai>=1.1.8",
    "grandalf>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
