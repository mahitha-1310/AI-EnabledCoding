[project]
name = "codemodernizer"
version = "0.1.0"
description = "A Streamlit app pondering chicken dreams"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "openai",
    "python-dotenv",
    "ipython>=9.10.0",
    "langchain-openai>=1.1.8",
    "grandalf>=0.8",
    "transformers",
    "torch==2.4.1",
    "torchvision==0.19.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

tool.uv.required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
